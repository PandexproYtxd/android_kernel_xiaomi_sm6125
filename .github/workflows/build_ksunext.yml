name: Build Ginkgo Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 python-is-python3 unzip wget zip zstd device-tree-compiler

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Neutron Clang & DTC 1.7.2
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S

          # Build DTC 1.7.2 required for Ginkgo DTBO overlays
          cd "$HOME"
          git clone --depth=1 -b v1.7.2 https://git.kernel.org/pub/scm/utils/dtc/dtc.git
          cd dtc
          make NO_PYTHON=1 NO_YAML=1 -j$(nproc)
          sudo install -m 0755 dtc /usr/local/bin/dtc

      - name: Integrate KernelSU-Next (v3.1.0-legacy-susfs)
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf drivers/kernelsu

          # Clone reference repo with ginkgo 4.14 KSU-Next + SUSFS patches
          git clone --depth=1 https://github.com/fnxln/kernel_xiaomi_ginkgo_ksu.git /tmp/ksu_ref

          # Try official setup.sh from main/legacy if available, otherwise copy driver directly
          if curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" -o /tmp/setup.sh; then
            bash /tmp/setup.sh legacy || true
          fi

          if [ ! -d "drivers/kernelsu" ] && [ -d "/tmp/ksu_ref/drivers/kernelsu" ]; then
            cp -r /tmp/ksu_ref/drivers/kernelsu drivers/kernelsu
          fi

          # Ensure Kconfig includes drivers/kernelsu
          if [ -d "drivers/kernelsu" ] && ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          fi

          # Apply manual hooks from fnxln reference patchset if present
          if [ -d "/tmp/ksu_ref/patches" ]; then
            cp -r /tmp/ksu_ref/patches ./
            chmod +x patches/apply.sh
            ./patches/apply.sh || true
          fi

      - name: Configure Defconfig
        run: |
          DEFCONFIG="vendor/ginkgo-perf_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="ginkgo-perf_defconfig"

          echo "CONFIG_KSU=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_WITH_KPROBES=n" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "arch/arm64/configs/$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "arch/arm64/configs/$DEFCONFIG"

      - name: Compile Kernel
        run: |
          export PATH="$HOME/clang/bin:/usr/local/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG="vendor/ginkgo-perf_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="ginkgo-perf_defconfig"

          make O=out ARCH=arm64 "$DEFCONFIG"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            DTC_EXT=/usr/local/bin/dtc

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk

          sed -i 's/kernel.string=.*/kernel.string=Lineage24-A17-KSUNext-SUSFS/' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' AnyKernel3/anykernel.sh

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

          cd AnyKernel3
          zip -r9 ../Ginkgo-A17-KSUNext-SUSFS.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-A17-KSUNext-SUSFS
          path: Ginkgo-A17-KSUNext-SUSFS.zip
